<!doctype html>
<html>
    <head>
        <title>Wells R Coding Example - Dplyr Pipeline</title>
        <link href="../parsons.css" rel="stylesheet" />
        <link href="../lib/prettify.css" rel="stylesheet" />
        <script src="../lib/prettify.js"></script>
    </head>
    <body>
        <h2>Dplyr Data Wrangling Pipeline</h2>
        <p>Construct a dplyr pipeline to calculate average salary by race and sort the results from highest to lowest.</p>
        <div id="sortableTrash" class="sortable-code"></div>
        <div id="sortable" class="sortable-code"></div>
        <div style="clear:both;"></div>
        <p>
            <a href="#" id="newInstanceLink">New instance</a>
            <a href="#" id="feedbackLink">Ready? Click here to get feedback</a>
        </p>
        <script src="../lib/jquery.min.js"></script>
        <script src="../lib/jquery-ui.min.js"></script>
        <script src="../lib/jquery.ui.touch-punch.min.js"></script>
        <script src="../lib/underscore-min.js"></script>
        <script src="../lib/lis.js"></script>
        <script src="../parsons.js"></script>
        <script>
        var initial = "MediaBucks %>%\n" +
                      "select(Race, Salary) %>%\n" +
                      "group_by(Race) %>%\n" +
                      "summarize(Avg_Salary = mean(Salary, na.rm=TRUE)) %>%\n" +
                      "arrange(desc(Avg_Salary))";

        function displayErrors(fb) {
            if(fb.errors.length > 0) {
                alert(fb.errors[0]);
            } else {
                alert("Great job! Your dplyr pipeline is in the correct order.");
            }
        } 

        $(document).ready(function(){
            var parson = new ParsonsWidget({
                sortableId: 'sortable',
                trashId: 'sortableTrash',
                max_wrong_lines: 1,
                feedback_cb : displayErrors,
                can_indent: false
            });
            parson.init(initial);
            parson.shuffleLines();
            $("#newInstanceLink").click(function(event){
                event.preventDefault();
                parson.shuffleLines();
            });
            $("#feedbackLink").click(function(event){
                event.preventDefault();
                parson.getFeedback();
            });
        });
        </script>
    </body>
</html>
